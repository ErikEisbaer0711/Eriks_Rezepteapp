<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Eriks Rezepte">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#DAD4C0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#26231F" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<title>Eriks Rezepte</title>
<style>
/* Layout: zweispaltig (Bibliothek | Rezept), auf dem iPhone eine Spalte mit Navigation */
:root {
  /* Eiche & Blatt: Wand, weißer Lack, Eiche, Blattgrün, Klappuhr-Schwarz */
  --bg: #ECEAE5;
  --surface: #FAF9F6;
  --surface-2: #F1EFEA;
  --fg: #262624;
  --fg-2: #67645E;
  --fg-3: #8E8A83;
  --line: rgba(38, 38, 36, .10);
  --accent: #46613F;
  --accent-soft: rgba(70, 97, 63, .12);
  --on-accent: #FAF9F6;
  --danger: #A7533D;
  --carbs: #C29A5E;
  --fat: #A8664A;
  --protein: #46613F;
  --good: #4F7A4A;
  --sage: #8DA57E;
  --mid: #CDB27A;
  --orange: #C98B5E;
  --bad: #A7533D;
  --night: #262624;
  --ink: #262624;
  --on-ink: #FAF9F6;
  --oak: #B08D62;
  --oak-soft: #EFE6D8;
  --oak-ink: #5E4B37;
  --leaf-soft: #DDE4D6;
  --leaf-ink: #34502E;
  --leaf-line: #A9BBA2;
  --clay-soft: #F3E4DA;
  --clay-ink: #7B3F28;
  --night-soft: #E2E0DC;
  --shadow: 0 1px 2px rgba(38, 38, 36, .05), 0 6px 20px rgba(38, 38, 36, .06);
  --shadow-sm: 0 1px 2px rgba(38, 38, 36, .06);
  --radius: 20px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji";
  --font-display: ui-serif, "New York", "Iowan Old Style", "Charter", Georgia, "Times New Roman", serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1C1A17; --surface: #262320; --surface-2: #2F2C28; --fg: #F1EEE8; --fg-2: #B4ADA3; --fg-3: #857F76;
    --line: rgba(241, 238, 232, .10); --accent: #8FB382; --accent-soft: rgba(143, 179, 130, .16); --on-accent: #1C1A17; --danger: #E08A70;
    --carbs: #D2AE72; --fat: #CF8A6C; --protein: #8FB382; --good: #7FA873; --sage: #A9C09A; --mid: #D9C07F; --orange: #D69A6C; --bad: #D9765C; --night: #CFC9BF;
    --ink: #F1EEE8; --on-ink: #1C1A17; --oak: #C9A87D; --oak-soft: #3A3128; --oak-ink: #E6D2B3; --leaf-soft: #2E3A2B; --leaf-ink: #BFD8B2; --leaf-line: #5F7A57;
    --clay-soft: #3E2A22; --clay-ink: #EDB8A0; --night-soft: #34312D; --shadow: 0 1px 2px rgba(0, 0, 0, .35); --shadow-sm: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1C1A17; --surface: #262320; --surface-2: #2F2C28; --fg: #F1EEE8; --fg-2: #B4ADA3; --fg-3: #857F76;
  --line: rgba(241, 238, 232, .10); --accent: #8FB382; --accent-soft: rgba(143, 179, 130, .16); --on-accent: #1C1A17; --danger: #E08A70;
  --carbs: #D2AE72; --fat: #CF8A6C; --protein: #8FB382; --good: #7FA873; --sage: #A9C09A; --mid: #D9C07F; --orange: #D69A6C; --bad: #D9765C; --night: #CFC9BF;
  --ink: #F1EEE8; --on-ink: #1C1A17; --oak: #C9A87D; --oak-soft: #3A3128; --oak-ink: #E6D2B3; --leaf-soft: #2E3A2B; --leaf-ink: #BFD8B2; --leaf-line: #5F7A57;
  --clay-soft: #3E2A22; --clay-ink: #EDB8A0; --night-soft: #34312D; --shadow: 0 1px 2px rgba(0, 0, 0, .35); --shadow-sm: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
}
:root { --tabh: 92px; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
img { max-width: 100%; }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- App-Gerüst ---------- */
#app { display: grid; grid-template-columns: 340px minmax(0, 1fr); height: calc(100% - var(--tabh) - env(safe-area-inset-bottom, 0px)); }
#sidebar { border-right: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; min-height: 0; padding-top: env(safe-area-inset-top, 0px); }
#main { overflow-y: auto; min-width: 0; padding-top: env(safe-area-inset-top, 0px); }
@media (max-width: 820px) {
  #app { grid-template-columns: minmax(0, 1fr); }
  body.detail-open #sidebar { display: none; }
  body:not(.detail-open) #main { display: none; }
  #sidebar { border-right: 0; }
}

.side-head { padding: 18px max(16px, env(safe-area-inset-left, 0px)) 10px 18px; display: flex; flex-direction: column; gap: 12px; }
.side-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.side-title h1 { margin: 0; font: 700 26px/1.1 var(--font-display); letter-spacing: -.02em; }
.side-title small { display: block; font: 600 11px/1 var(--font); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }
.icon-btn { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--surface-2); display: inline-grid; place-items: center; color: var(--accent); flex: none; }
.icon-btn:hover { filter: brightness(.96); }
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn.primary { background: var(--accent); color: #fff; }
.search { display: flex; align-items: center; gap: 6px; background: var(--surface-2); border-radius: 10px; padding: 0 10px; height: 36px; }
.search svg { width: 16px; height: 16px; color: var(--fg-3); flex: none; }
.search input { border: 0; background: transparent; outline: none; width: 100%; height: 100%; }
.sort-row { display: flex; justify-content: space-between; align-items: center; color: var(--fg-2); font-size: 13px; }
.sort-row select { border: 0; background: transparent; color: var(--accent); font-size: 13px; padding: 0; }

.chip { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 5px 11px; font-size: 13px; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
.chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.chip.soft { background: var(--surface-2); border-color: transparent; color: var(--fg-2); }
.chip svg { width: 12px; height: 12px; }

.list { overflow-y: auto; padding: 4px 10px 24px; display: flex; flex-direction: column; gap: 2px; flex: 1; }
.list-item { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 12px; align-items: center; padding: 8px; border-radius: 12px; border: 0; background: transparent; text-align: left; width: 100%; }
.list-item:hover { background: var(--surface-2); }
.list-item.active { background: var(--accent-soft); }
.list-item .thumb { width: 54px; height: 54px; border-radius: 11px; }
.list-item .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list-item .m { color: var(--fg-2); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list-item .m b { color: var(--protein); font-weight: 600; }
.badge { font-size: 10px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--fg-2); background: var(--surface-2); border-radius: 5px; padding: 2px 5px; margin-left: 4px; vertical-align: 1px; }
.empty-list { color: var(--fg-2); text-align: center; padding: 40px 16px; font-size: 14px; }
.side-foot { border-top: 1px solid var(--line); padding: 10px 14px; display: flex; gap: 8px; flex-wrap: wrap; }
.link-btn { border: 0; background: transparent; color: var(--accent); padding: 4px 6px; font-size: 13px; border-radius: 6px; }
.link-btn:hover { background: var(--accent-soft); }
.link-btn.danger { color: var(--danger); }

.thumb { background-size: cover; background-position: center; display: grid; place-items: center; color: #fff; font: 700 22px/1 var(--font-display); overflow: hidden; }

/* ---------- Toolbar ---------- */
.toolbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 8px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid transparent; }
.toolbar.scrolled { border-bottom-color: var(--line); }
.toolbar .spacer { flex: 1; }
.toolbar .tb-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.btn { border: 0; border-radius: 980px; padding: 7px 15px; background: var(--surface-2); color: var(--accent); font-weight: 500; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { filter: brightness(.97); }
.btn.primary { background: var(--accent); color: #fff; }
.btn.danger { color: var(--danger); }
.btn svg { width: 16px; height: 16px; }
.back-btn { border: 0; background: transparent; color: var(--accent); display: none; align-items: center; gap: 2px; padding: 4px 4px 4px 0; font-size: 16px; }
.back-btn svg { width: 20px; height: 20px; }
@media (max-width: 820px) { .back-btn { display: inline-flex; } .btn .lbl-wide { display: none; } .toolbar { gap: 6px; } .toolbar .btn { padding: 7px 11px; } }
@media (max-width: 440px) { .back-btn .lbl-back { display: none; } .toolbar { overflow-x: auto; scrollbar-width: none; } }

/* ---------- Detailansicht ---------- */
.page { max-width: 860px; margin: 0 auto; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 60px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 22px; }
.hero { position: relative; border-radius: 20px; overflow: hidden; aspect-ratio: 16 / 8; max-width: 100%; background: var(--surface-2); }
.hero .thumb { position: absolute; inset: 0; font-size: 72px; }
.hero.noimg { aspect-ratio: auto; height: 132px; }
.hero.noimg .thumb { font-size: 48px; }
.title-block h2 { margin: 0; font: 700 34px/1.12 var(--font-display); letter-spacing: -.025em; text-wrap: balance; }
.title-block p { margin: 6px 0 0; color: var(--fg-2); font-size: 17px; }
.meta-row { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--fg-2); font-size: 14px; margin-top: 12px; align-items: center; }
.meta-row a { color: var(--accent); text-decoration: none; }
.meta-row svg { width: 15px; height: 15px; vertical-align: -2px; margin-right: 4px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }

.card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 20px; }
.sec-title { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 0 0 12px; }
.sec-title h3 { margin: 0; font: 700 20px/1.2 var(--font-display); letter-spacing: -.015em; }
.sec-title .hint { color: var(--fg-2); font-size: 13px; }

.macro-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 14px; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 9px; padding: 2px; }
.seg button { border: 0; background: transparent; border-radius: 7px; padding: 4px 12px; font-size: 13px; font-weight: 500; color: var(--fg); }
.seg button.on { background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
:root[data-theme="dark"] .seg button.on { background: #636366; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .seg button.on { background: #636366; } }
.macros { display: grid; grid-template-columns: 1.3fr repeat(3, 1fr); gap: 14px; }
.macro .v { font: 700 30px/1 var(--font-display); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.macro .v span { font-size: 15px; font-weight: 600; color: var(--fg-2); margin-left: 2px; letter-spacing: 0; }
.macro .l { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--fg-2); margin-top: 6px; display: flex; align-items: center; gap: 6px; }
.macro .l i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.energy-bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--surface-2); margin-top: 16px; gap: 2px; }
.energy-bar div { height: 100%; }
.energy-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--fg-2); margin-top: 8px; }
.facts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.fact { background: var(--surface-2); border-radius: 10px; padding: 8px 12px; font-size: 13px; color: var(--fg-2); }
.fact b { color: var(--fg); font-weight: 600; }
@media (max-width: 560px) { .macros { grid-template-columns: repeat(3, 1fr); } .macros .macro:first-child { grid-column: 1 / -1; } .title-block h2 { font-size: 28px; } }

.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--fg-2); cursor: pointer; user-select: none; }
.switch { position: relative; width: 38px; height: 23px; flex: none; }
.switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: 23px; background: var(--surface-2); border: 1px solid var(--line); transition: background .2s; }
.switch span::after { content: ""; position: absolute; top: 1px; left: 1px; width: 19px; height: 19px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
.switch input:checked + span { background: var(--protein); border-color: var(--protein); }
.switch input:checked + span::after { transform: translateX(15px); }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

.two-col { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 22px; align-items: start; }
@media (max-width: 760px) { .two-col { grid-template-columns: minmax(0, 1fr); } }

.ing-list { list-style: none; margin: 0; padding: 0; }
.ing-list li { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
.ing-list li:last-child { border-bottom: 0; }
.ing-list .amt { color: var(--fg-2); font-size: 14px; text-align: right; white-space: nowrap; }
.ing-list .kc { display: block; font-size: 12px; color: var(--fg-3); }
.ing-list li.done .nm { text-decoration: line-through; color: var(--fg-3); }
.opt-tag { font-size: 11px; font-weight: 600; color: var(--accent); background: var(--accent-soft); border-radius: 5px; padding: 1px 6px; margin-left: 6px; vertical-align: 1px; white-space: nowrap; }
.check { appearance: none; -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--fg-3); margin: 0; display: grid; place-items: center; cursor: pointer; background: transparent; flex: none; }
.check:checked { background: var(--accent); border-color: var(--accent); }
.check:checked::after { content: ""; width: 10px; height: 5px; border-left: 2px solid #fff; border-bottom: 2px solid #fff; transform: rotate(-45deg) translate(1px, -1px); }
.check.square { border-radius: 6px; }

.spice-group + .spice-group { margin-top: 16px; }
.spice-group h4 { margin: 0 0 8px; font-size: 13px; font-weight: 600; color: var(--fg-2); text-transform: uppercase; letter-spacing: .05em; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.spice-group h4 em { font-style: normal; text-transform: none; letter-spacing: 0; color: var(--accent); font-weight: 500; font-size: 12px; }
.spice-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.spice-chip { background: var(--surface-2); border-radius: 8px; padding: 6px 10px; font-size: 14px; }
.spice-chip small { color: var(--fg-2); margin-left: 4px; }

.steps { list-style: none; margin: 0; padding: 0; counter-reset: s; display: flex; flex-direction: column; gap: 4px; }
.steps li { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; padding: 8px 0; cursor: pointer; }
.steps li::before { counter-increment: s; content: counter(s); width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 14px; display: grid; place-items: center; }
.steps li.done::before { content: "✓"; background: var(--protein); color: #fff; }
.steps li.done .st { color: var(--fg-3); }
.steps .st { padding-top: 3px; white-space: pre-wrap; }
.steps .st-sp { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.steps .st-sp span { font-size: 12px; color: var(--fg-2); background: var(--surface-2); border-radius: 6px; padding: 2px 7px; }

.notes { white-space: pre-wrap; color: var(--fg); }
.rel-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.rel { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; align-items: center; border: 1px solid var(--line); background: transparent; border-radius: 12px; padding: 8px; text-align: left; }
.rel:hover { background: var(--surface-2); }
.rel .thumb { width: 44px; height: 44px; border-radius: 9px; font-size: 17px; }
.rel b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rel span { font-size: 12px; color: var(--fg-2); }
.muted { color: var(--fg-2); font-size: 14px; }

.welcome { max-width: 520px; margin: 14vh auto 0; text-align: center; padding: 0 16px; display: flex; flex-direction: column; gap: 14px; align-items: center; }
.welcome h2 { margin: 0; font: 700 28px/1.15 var(--font-display); letter-spacing: -.02em; }
.welcome p { margin: 0; color: var(--fg-2); }
.flake { width: 56px; height: 56px; color: var(--accent); }

/* ---------- Editor ---------- */
.form-sec { display: flex; flex-direction: column; gap: 8px; }
.form-sec > label.cap, .cap { font-size: 13px; font-weight: 500; color: var(--fg-2); text-transform: uppercase; letter-spacing: .05em; padding: 0 4px; }
.group { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; padding: 0 16px; min-height: 46px; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row > label { width: 150px; flex: none; color: var(--fg); }
.row input, .row textarea, .row select { border: 0; background: transparent; outline: none; flex: 1; min-width: 0; padding: 12px 0; }
.row textarea { resize: vertical; min-height: 90px; }
.row input::placeholder, .row textarea::placeholder, .field::placeholder { color: var(--fg-3); }
@media (max-width: 560px) { .row > label { width: 110px; } }
.field { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 7px 9px; min-width: 0; width: 100%; outline: none; }
.field:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea.field { resize: vertical; min-height: 64px; line-height: 1.45; }
.title-input { font: 700 26px/1.2 var(--font-display) !important; letter-spacing: -.02em; }

.img-pick { position: relative; aspect-ratio: 16 / 8; max-width: 100%; border-radius: var(--radius); overflow: hidden; background: var(--surface-2); border: 1.5px dashed var(--line); display: grid; place-items: center; color: var(--fg-2); cursor: pointer; }
.img-pick.has { border-style: solid; }
.img-pick img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.img-pick .ph { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 14px; text-align: center; padding: 10px; }
.img-pick .ph svg { width: 30px; height: 30px; color: var(--accent); }
.img-actions { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 6px; }
.img-actions .btn { background: rgba(0,0,0,.55); color: #fff; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }

.ing-table { display: flex; flex-direction: column; }
.ing-head, .ing-row { display: grid; grid-template-columns: 26px minmax(120px, 2.4fr) 66px 70px repeat(4, 62px) 58px; gap: 6px; align-items: center; padding: 6px 12px; }
.ing-head { font-size: 11px; font-weight: 600; color: var(--fg-2); text-transform: uppercase; letter-spacing: .04em; padding-top: 10px; }
.ing-head span.r, .ing-row input.r { text-align: right; }
.ing-row { border-top: 1px solid var(--line); }
.ing-row .field { padding: 6px 7px; font-size: 14px; }
.ing-row .row-btns { display: flex; gap: 2px; justify-content: flex-end; }
.mini { width: 26px; height: 26px; border: 0; border-radius: 7px; background: transparent; color: var(--fg-2); display: grid; place-items: center; padding: 0; }
.mini:hover { background: var(--surface-2); color: var(--fg); }
.mini.del:hover { color: var(--danger); }
.mini svg { width: 15px; height: 15px; }

.tp { padding-top: 10px; }
@media (max-width: 600px) {
  .tp-hero-head { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "title shelf" "actions actions"; gap: 8px 10px; }
  .tp-hero-head > .shelf-wrap { justify-self: end; margin-bottom: 0; }
  .tp-hero-head .shelf { width: 112px; }
  .tp-head h1 { font-size: clamp(27px, 8.2vw, 36px); }
  .brand .shelf { width: 128px; }
  .tp { gap: 20px; }
}
.tp-actions .gear, .side-foot .gear { margin-left: auto; }
.side-foot .gear { width: 32px; height: 32px; }
.icon-btn.gear svg { width: 19px; height: 19px; }

/* Suche */
.search { position: relative; }
.search input { font-size: 15px; }
.search input::-webkit-search-cancel-button { display: none; }
.search-x { display: none; border: 0; background: var(--fg-3); color: var(--surface); width: 20px; height: 20px; border-radius: 50%; place-items: center; padding: 0; flex: none; cursor: pointer; }
.search-x svg { width: 12px; height: 12px; stroke-width: 3; }
.search.has-q .search-x { display: grid; }

/* Sortierung klein */
.sort-pick { position: relative; display: inline-flex; align-items: center; gap: 4px; color: var(--accent); font-size: 13px; font-weight: 600; cursor: pointer; }
.sort-pick svg { width: 13px; height: 13px; }
.sort-pick select { position: absolute; inset: -6px -4px; opacity: 0; font-size: 16px; width: auto; cursor: pointer; }

/* Filter-Fuß */
.fp-foot { justify-content: space-between; }

/* Woche */
.wk-shop { width: 100%; justify-content: center; height: 48px; font-size: 15px; border-radius: 14px; }
.work-sel { padding-left: 10px; }
.work-sel .wk-emo { font-size: 16px; line-height: 1; flex: none; }
.work-sel.s-work { background: var(--clay-soft); color: var(--clay-ink); }
.work-sel.s-free { background: var(--oak-soft); color: var(--oak-ink); }
.ds.work { background: var(--clay-soft); }
.ds.work b { color: var(--clay-ink); }
.ds.free { background: color-mix(in srgb, var(--oak-soft) 70%, var(--surface)); }
.ds.on, .ds.on.work, .ds.on.free { background: var(--accent); }
.ds-dot.s-work { background: var(--orange); }
.ds-dot.s-free { background: var(--oak); }
.ds.on .ds-dot.s-work, .ds.on .ds-dot.s-free, .ds.on .ds-dot.s-ort { background: #fff; }
.ds.on.work b, .ds.on.free b { color: #fff; }
@media (max-width: 600px) {
  .sum-tile { padding: 12px 12px; }
  .sum-tile b { font-size: 19px; white-space: nowrap; }
  .sum-tile small { font-size: 11.5px; line-height: 1.35; display: block; margin-top: 2px; }
}

/* Mahlzeiten: Art als Überschrift, darunter der Eintrag */
.meal { display: flex; flex-direction: column; align-items: stretch; gap: 4px; min-height: 0; padding: 4px 0; }
.meal .mt { font-size: 11.5px; font-weight: 600; color: var(--fg-2); text-transform: uppercase; letter-spacing: .05em; align-self: flex-start; }
.meal .mt-pick span { text-transform: uppercase; }
.meal-line { display: flex; align-items: center; gap: 6px; min-width: 0; }
.meal-line > :first-child { flex: 1; min-width: 0; }
.meal-line .row-btns { display: flex; flex: none; }
.meal-rec, .meal-txt { border: 1.5px solid transparent; }
.prepped { border-color: var(--accent) !important; }
.meal-pick { padding: 9px 12px; }

/* Vorbereitet */
.prep-btn { display: grid; grid-template-columns: 26px minmax(0, 1fr) 16px; gap: 10px; align-items: center; width: 100%; border: 0; background: transparent; padding: 2px 0; text-align: left; color: var(--fg); font: inherit; cursor: pointer; }
.prep-btn > svg { width: 15px; height: 15px; color: var(--fg-3); }
.prep-ic { width: 24px; height: 24px; border-radius: 7px; border: 1.5px solid var(--line); display: grid; place-items: center; }
.prep-ic svg { width: 14px; height: 14px; }
.prep-btn.some .prep-ic, .prep-btn.all .prep-ic { background: var(--accent); border-color: var(--accent); color: #fff; }
.prep-btn.some .prep-ic { opacity: .6; }
.prep-t b { display: block; font-size: 14px; font-weight: 600; }
.prep-t small { display: block; font-size: 12.5px; color: var(--fg-2); }
.prep-list { display: flex; flex-direction: column; gap: 8px; }

/* Grüne Bestätigen-Knöpfe */
.go-btn { width: 36px; height: 36px; flex: none; border: 0; border-radius: 10px; background: var(--accent); color: #fff; display: grid; place-items: center; cursor: pointer; }
.go-btn svg { width: 18px; height: 18px; }
.inline-add .field { height: 36px; }

/* Einstellungen */
.duty-list { display: flex; flex-direction: column; gap: 6px; }
.duty-row { display: flex; gap: 6px; align-items: center; }
.duty-row .field { flex: 1; min-width: 0; }

/* ===== Runde 11 ===== */
:root { --bar-gap: 14px; --bar-h: 66px; --bar-space: calc(var(--bar-gap) + var(--bar-h) + 16px); }
/* Untere Leiste: überall gleicher Abstand zum Rand */
#tabbar { left: var(--bar-gap); right: var(--bar-gap); bottom: var(--bar-gap); width: auto; max-width: 560px; margin: 0 auto; transform: none; height: var(--bar-h); border-radius: calc(var(--bar-h) / 2); }
body::after { height: calc(var(--bar-gap) + var(--bar-h) + 16px); }
/* Inhalte laufen hinter den durchscheinenden Leisten weiter */
#app, #tabpage { height: 100%; }
#main { padding-bottom: var(--bar-space); }
.tp { padding-bottom: calc(var(--bar-space) + 20px); }
.side-foot { margin-bottom: var(--bar-space); }
body::before { content: ""; position: fixed; left: 0; right: 0; top: 0; height: env(safe-area-inset-top, 0px); background: color-mix(in srgb, var(--bg) 72%, transparent); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); z-index: 50; pointer-events: none; }
#toast.toast { bottom: calc(var(--bar-gap) + var(--bar-h) + 34px); z-index: 70; }
.reminder.reminder { bottom: calc(var(--bar-gap) + var(--bar-h) + 30px); }
/* Überschriften etwas tiefer */
.tp { padding-top: 22px; }
.brand { padding-top: 16px; }

@media (max-width: 600px) {
  .tp-hero-head { align-items: start; }
  .tp-hero-head > .shelf-wrap { margin-top: -10px; }
  .tp-hero-head h1 { padding-top: 14px; }
}
/* Rezeptliste */
.list-item .thumb.emo, .thumb.emo { font: 400 26px/1 var(--font); }
.rel .thumb.emo { font-size: 22px; } .meal-rec .thumb.emo { font-size: 17px; } .link-opt .thumb.emo { font-size: 18px; }
.hero .thumb.emo { font-size: 64px; }
.list-item .m .kc { color: var(--fg); font-weight: 700; }

/* Zeiten: vier Kacheln */
.times { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 600px) { .times { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.time.zero b, .time.zero small { color: var(--fg-3); }
.time.zero b { font-weight: 500; }

/* Gewürze: Menge zuerst */
.spice-chip b { font-weight: 600; }

/* Einkauf aus Rezept: Menge in einer Zeile */
.preview td.r { white-space: nowrap; }
.preview .pbadge { white-space: nowrap; }

/* Jetzt kochen */
.cook-go { width: 100%; justify-content: center; height: 50px; font-size: 16px; border-radius: 14px; margin-top: 14px; }
.cook { position: fixed; inset: 0; z-index: 80; background: var(--bg); color: var(--fg); display: flex; flex-direction: column; padding: calc(env(safe-area-inset-top, 0px) + 10px) max(18px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 14px) max(18px, env(safe-area-inset-left, 0px)); }
body.cooking #tabbar, body.cooking::after, body.cooking .reminder { display: none; }
.cook-top { display: flex; align-items: center; gap: 12px; }
.cook-dots { flex: 1; display: flex; gap: 4px; }
.cook-dots i { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
.cook-dots i.done { background: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.cook-dots i.on { background: var(--accent); }
.cook-body { flex: 1; overflow-y: auto; padding: 22px 2px; display: flex; flex-direction: column; gap: 16px; }
.cook-k { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.cook-t { margin: 0; font: 600 30px/1.15 var(--font-display); }
.cook-step { margin: 0; font: 500 clamp(24px, 6.6vw, 34px)/1.35 var(--font); text-wrap: pretty; }
.cook-for { border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 8px; }
.cook-ing { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 17px; }
.cook-ing.big { font-size: 19px; gap: 9px; }
.cook-ing li { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 10px; }
.cook-ing .ca { color: var(--fg-2); font-weight: 600; text-align: right; }
.cook-ing em { color: var(--fg-3); font-style: normal; font-size: .85em; }
.cook-nav { display: grid; grid-template-columns: 1fr 1.6fr; gap: 10px; }
.cook-nav .btn { height: 56px; justify-content: center; font-size: 17px; border-radius: 16px; }

/* Wochenplanung */
.ds.free { background: var(--surface); }
.ds.free b { color: var(--fg); }

/* Mahlzeit wählen */
#pick-text.chosen { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); background: var(--leaf-soft); }
.pick-list .rel { border: 1.5px solid transparent; }
.pick-list .rel.sel { border-color: var(--accent); background: var(--leaf-soft); }

/* Dialoge passen aufs iPhone (zur Not scrollen) */
dialog, .dlg { max-height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - 32px); }
.dlg-body { min-height: 0; overscroll-behavior: contain; }

/* Vorrat: Ziehen */
.pitem { grid-template-columns: 22px 26px minmax(0, 1fr) auto auto; padding-left: 4px; }
.grip { border: 0; background: transparent; color: var(--fg-3); width: 22px; height: 34px; display: grid; place-items: center; padding: 0; cursor: grab; touch-action: none; -webkit-user-select: none; user-select: none; }
.grip svg { width: 16px; height: 16px; fill: currentColor; stroke: none; }
.pitem.dragging { opacity: .35; }
.drag-ghost { position: fixed; left: 0; top: 0; z-index: 90; pointer-events: none; background: var(--surface); border-radius: 12px; box-shadow: 0 14px 34px rgba(38, 38, 36, .22); border: 0; }
body.drag-active, body.drag-active * { cursor: grabbing !important; -webkit-user-select: none; user-select: none; }
.pcat.drop-on { outline: 2px solid var(--accent); outline-offset: 2px; background: color-mix(in srgb, var(--leaf-soft) 50%, var(--surface)); }

@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg-veil: color-mix(in srgb, #1C1A17 84%, transparent); } }
:root[data-theme="dark"] { --bg-veil: color-mix(in srgb, #1C1A17 84%, transparent); }
#bgimg { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: var(--bg-veil), var(--bg-image) center / cover no-repeat, var(--bg); }
#bgimg { background: linear-gradient(var(--bg-veil), var(--bg-veil)), var(--bg-image) center / cover no-repeat, var(--bg); }
body.bg-pantry #bgimg { background: linear-gradient(var(--bg-veil), var(--bg-veil)), var(--bg-image-2) center / cover no-repeat, var(--bg); }
#app, #tabpage { position: relative; z-index: 1; }
#bgimg { top: calc(-1 * env(safe-area-inset-top, 0px)); }
/* Lesbarkeit auf dem Regal-Bild */
body.bg-pantry .tp > p, body.bg-pantry .empty-state, body.bg-pantry .tp-head .sub { background: color-mix(in srgb, var(--surface) 78%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: 12px; padding: 8px 12px; justify-self: start; width: fit-content; max-width: 100%; }
body.bg-pantry .tp-head .sub { padding: 2px 10px; margin-top: 4px; }
body.bg-pantry .empty-state { margin: 0 auto; padding: 18px 20px; }
/* Leisten oben und unten: 70 % durchsichtig */
#tabbar { background: color-mix(in srgb, var(--surface) 30%, transparent) !important; backdrop-filter: saturate(170%) blur(22px); -webkit-backdrop-filter: saturate(170%) blur(22px); border-color: color-mix(in srgb, var(--line) 60%, transparent); }
.toolbar { background: color-mix(in srgb, var(--bg) 30%, transparent) !important; }
body::before { background: linear-gradient(to bottom, color-mix(in srgb, var(--bg) 20%, transparent), transparent); backdrop-filter: none; -webkit-backdrop-filter: none; }
body::after { background: linear-gradient(to bottom, transparent, color-mix(in srgb, var(--bg) 25%, transparent) 60%); }
@keyframes slideNext { from { transform: translateX(40px); opacity: .3; } to { transform: none; opacity: 1; } }
@keyframes slidePrev { from { transform: translateX(-40px); opacity: .3; } to { transform: none; opacity: 1; } }
.days.slide-next > .day { animation: slideNext .28s ease-out; }
.days.slide-prev > .day { animation: slidePrev .28s ease-out; }
/* Tage: mehr Abstand, damit die Nachbartage nicht hervorschauen */
@media (max-width: 760px) { .days { gap: 36px; } }
#sidebar, #main, #tabpage { background: transparent; }
@media (min-width: 821px) { #sidebar { background: color-mix(in srgb, var(--bg) 55%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); } }
@media print { #bgimg { display: none; } }
.side-foot { margin-left: 12px; margin-right: 12px; border: 0; border-radius: 14px; background: color-mix(in srgb, var(--surface) 82%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); align-items: center; }

/* ===== Runde 14: Tage ohne Wackeln ===== */
@media (max-width: 760px) {
  .days, .days:is(#days) { display: block; overflow: visible; scroll-snap-type: none; margin: 0; padding: 0; height: auto !important; touch-action: pan-y; }
  .days > .day { display: none; }
  .days > .day.active { display: flex; transition: transform .2s ease; }
  .days > .day.slide-next { animation: slideNext .26s ease-out; }
  .days > .day.slide-prev { animation: slidePrev .26s ease-out; }
}
/* ===== Runde 13 ===== */
.quick-mac { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.quick-mac label { display: flex; flex-direction: column; gap: 2px; }
.quick-mac small { font-size: 11px; color: var(--fg-2); font-weight: 600; }
.quick-mac .field { text-align: center; padding: 7px 4px; }
.meal-txt.has-mac { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; -webkit-line-clamp: unset; }
.meal-txt.has-mac b { font-weight: 600; }
.meal-txt.has-mac span { font-size: 12px; opacity: .85; font-weight: 500; }

const Store = {
  mode: 'memory', db: null, mem: new Map(), memkv: new Map(),
  async init() {
    try {
      this.db = await new Promise((res, rej) => {
        const req = indexedDB.open('winter-arc-rezepte', 2);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains('recipes')) db.createObjectStore('recipes', { keyPath: 'id' });
          if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv', { keyPath: 'key' });
        };
        req.onsuccess = () => { req.result.onversionchange = () => req.result.close(); res(req.result); };
        req.onerror = () => rej(req.error);
        req.onblocked = () => toast('Bitte schließe andere Tabs mit der Rezept-App, dann geht es weiter.');
        setTimeout(() => rej(new Error('timeout')), 15000);
      });
      await this._tx('readonly', s => s.count());
      this.mode = 'idb'; return;
    } catch (e) { this.db = null; }
    try { localStorage.setItem('__wa_t', '1'); localStorage.removeItem('__wa_t'); this.mode = 'ls'; } catch (e) { this.mode = 'memory'; }
  },
  _tx(mode, fn, store = 'recipes') {
    return new Promise((res, rej) => {

      tx.oncomplete = () => res(r && r.result); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
    });
  },
  async all() {
    if (this.mode === 'idb') return (await this._tx('readonly', s => s.getAll())) || [];
    if (this.mode === 'ls') { try { return JSON.parse(localStorage.getItem('wa_recipes') || '[]'); } catch (e) { return []; } }
    return [...this.mem.values()];
  },
  async putMany(list) {
    if (!list.length) return;
    if (this.mode === 'idb') return this._tx('readwrite', s => { list.forEach(r => s.put(r)); });
    if (this.mode === 'ls') return this._lsWrite();
    list.forEach(r => this.mem.set(r.id, r));
  },
  async del(id) {
    if (this.mode === 'idb') return this._tx('readwrite', s => s.delete(id));
    if (this.mode === 'ls') return this._lsWrite();
    this.mem.delete(id);
  },
  _lsWrite() {
    try { localStorage.setItem('wa_recipes', JSON.stringify(state.recipes)); }
    catch (e) { toast('Speicher voll – bitte Backup exportieren oder Bilder entfernen.'); throw e; }
  },
};
const KV = {
  async get(key, def) {
    try {
      if (Store.mode === 'idb') { const v = await Store._tx('readonly', s => s.get(key), 'kv'); return v ? v.value : def; }

      return Store.memkv.has(key) ? Store.memkv.get(key) : def;
    } catch (e) { return def; }
  },
  async set(key, value) {
    try {
      if (Store.mode === 'idb') return await Store._tx('readwrite', s => s.put({ key, value }), 'kv');
      if (Store.mode === 'ls') return localStorage.setItem('wa_kv_' + key, JSON.stringify(value));
      Store.memkv.set(key, value);
    } catch (e) { toast('Speichern fehlgeschlagen. Bitte ein Backup sichern.'); }
  },
};

function persist(key) { clearTimeout(_saveT[key]); _saveT[key] = setTimeout(() => KV.set(key, state[key]), 200); }

function newRecipe() {
  return {
    id: uid(), title: '', subtitle: '', source: '', image: '', servings: 1, prepTime: '', prepMin: '', cookMin: '', restMin: '', totalMin: '', emoji: '', weight: '', warnings: [], warnText: '', ingMacros: true,
    tags: [], ingredients: [newIng()], macroMode: 'auto', manual: { kcal: '', carbs: '', fat: '', protein: '' },
    spiceGroups: [], steps: [''], notes: '', links: [], createdAt: Date.now(), updatedAt: Date.now(),
  };
}
function newIng(o = {}) { return Object.assign({ id: uid(), name: '', amount: '', unit: 'g', kcal: '', carbs: '', fat: '', protein: '', optional: false }, o); }
function normalize(r) {
  const b = newRecipe();
  const out = Object.assign(b, r);
  out.ingredients = (r.ingredients || []).map(i => newIng(i));
  out.spiceGroups = (r.spiceGroups || []).map(g => ({ id: g.id || uid(), name: g.name || '', step: g.step ?? '', spices: (g.spices || []).map(s => ({ name: s.name || '', amount: s.amount || '' })) }));
  out.steps = Array.isArray(r.steps) ? r.steps.map(String) : [];

  if (r.prepMin === undefined && r.prepTime) out.prepMin = parseNum(r.prepTime) || '';

  out.tags = [...new Set(out.tags.map(t => t === 'Herzhaft' ? 'Deftig' : t))];
  out.warnings = Array.isArray(r.warnings) ? r.warnings : [];
  if (r.ingMacros === undefined) out.ingMacros = r.macroMode !== 'manual';
  out.macroMode = out.ingMacros ? 'auto' : 'manual';
  // Sicherheit: nur echte, eingebettete Bilder zulassen und Textfelder als Text behandeln
  out.image = safeImage(out.image);

}

function sumIngredients(r, inclOpt) {

}

async function saveRecipe(r) {
  r.updatedAt = Date.now();
  const idx = state.recipes.findIndex(x => x.id === r.id);
  if (idx >= 0) state.recipes[idx] = r; else state.recipes.push(r);
  // Verknüpfungen in beide Richtungen pflegen
  const changed = [r];
  r.links = [...new Set(r.links.filter(id => id !== r.id && byId(id)))];
  for (const o of state.recipes) {
    if (o.id === r.id) continue;
    const should = r.links.includes(o.id), has = o.links.includes(r.id);
    if (should && !has) { o.links.push(r.id); changed.push(o); }
    if (!should && has) { o.links = o.links.filter(x => x !== r.id); changed.push(o); }

  const changed = [];
  for (const o of state.recipes) if (o.links.includes(id)) { o.links = o.links.filter(x => x !== id); changed.push(o); }
  await Store.del(id);

  if (hsh.startsWith('r-')) return { name: 'view', id: hsh.slice(2) };
  if (hsh.startsWith('e-')) return { name: 'edit', id: hsh.slice(2) };

/* =========================================================
   Backup, Wiederherstellen, Rezepte teilen
   Alles bleibt auf dem Gerät. Daten verlassen es nur, wenn du
   selbst ein Backup sicherst oder ein Rezept teilst.
   ========================================================= */
const BACKUP_DAYS = 7;
const MAX_IMPORT_BYTES = 300 * 1024 * 1024;
function fmtBytes(b) { if (b < 1024) return `${b} Byte`; if (b < 1024 * 1024) return `${fmt(b / 1024, 0)} KB`; return `${fmt(b / 1024 / 1024, 1)} MB`; }
function slugify(t) { return (t || 'rezept').toLowerCase().replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 50) || 'rezept'; }
function relDays(ts) {
  const d = Math.floor((Date.now() - ts) / 864e5);
  return d <= 0 ? 'heute' : d === 1 ? 'gestern' : `vor ${d} Tagen`;
}
function hasOwnData() {
  return state.recipes.some(r => !r.example) || Object.values(state.plan.days || {}).some(d => (d.meals || []).some(m => m.recipeId || m.text) || d.shift || d.place) || state.shop.length > 0;
}
function backupStatus() {
  const last = Settings.get('lastBackup', 0);
  const warn = hasOwnData() && (!last || Date.now() - last > BACKUP_DAYS * 864e5);
  return { last, warn, short: last ? `Letztes Backup ${relDays(last)}` : 'Noch kein Backup', long: last ? `Letztes Backup: ${relDays(last)} (${new Date(last).toLocaleString('de-DE', { dateStyle: 'short', timeStyle: 'short' })})` : 'Du hast noch kein Backup gesichert.' };
}
function buildBackup(withPhotos = true) {
  const recipes = withPhotos ? state.recipes : state.recipes.map(r => Object.assign({}, r, { image: '' }));
  return { app: 'eriks-rezepte', type: 'backup', version: 3, exportedAt: new Date().toISOString(), withPhotos,
    counts: { recipes: state.recipes.length, days: Object.keys(state.plan.days || {}).length, pantry: state.pantry.items.length, shop: state.shop.length },
    recipes, plan: state.plan, pantry: state.pantry, shop: state.shop };
}
const isTouchDevice = () => matchMedia('(pointer: coarse)').matches || navigator.standalone === true;
// Datei übergeben: iPhone → Teilen-Menü („In Dateien sichern“, AirDrop …), Mac → Speicherort wählen oder Downloads
async function saveFile(filename, text, title) {
  const blob = new Blob([text], { type: 'application/json' });
  if (isTouchDevice() && navigator.canShare && typeof File === 'function') {
    const file = new File([blob], filename, { type: 'application/json' });
    if (navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title }); return 'shared'; }
      catch (e) { if (e && e.name === 'AbortError') return 'aborted'; }
    }
  }
  if (window.showSaveFilePicker) {
    try {
      const hnd = await window.showSaveFilePicker({ suggestedName: filename, types: [{ description: 'Rezept-Datei (JSON)', accept: { 'application/json': ['.json'] } }] });
      const w = await hnd.createWritable(); await w.write(blob); await w.close(); return 'saved';
    } catch (e) { if (e && e.name === 'AbortError') return 'aborted'; }
  }
  const a = h('a', { href: URL.createObjectURL(blob), download: filename });
  document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  return 'downloaded';
}
async function exportBackup(withPhotos = true) {
  const text = JSON.stringify(buildBackup(withPhotos));
  const name = `eriks-rezepte-backup-${new Date().toISOString().slice(0, 10)}${withPhotos ? '' : '-ohne-fotos'}.json`;
  const res = await saveFile(name, text, 'Eriks Rezepte – Backup');
  if (res === 'aborted') return toast('Backup abgebrochen');
  Settings.set('lastBackup', Date.now());
  toast(`Backup gesichert (${fmtBytes(new Blob([text]).size)})`);
  renderSidebar(route());
  if ($('#dlg').open && $('#bk-dialog')) openMenu();
}

const COOK_STOP = new Set(['light', 'frisch', 'frische', 'gehackt', 'gewürfelt', 'bio', 'dose', 'glas', 'packung', 'stück', 'prise', 'etwas', 'optional', 'oder', 'und', 'mit', 'ohne']);
function ingKeys(name) {
  const base = name.toLowerCase().split(' - ').pop();
  const words = base.split(/[\s,()/–-]+/).filter(w => w.length >= 4 && !COOK_STOP.has(w));
  return [...new Set(words.flatMap(w => [w, w.replace(/(en|n|e|s)$/, '')]).filter(w => w.length >= 4))];
}
function stepIngredients(r, text) {
  const t = text.toLowerCase();
  return r.ingredients.filter(i => i.name.trim() && ingKeys(i.name).some(k => t.includes(k)));
}
let wakeLock = null;
async function keepAwake(on) {
  try {
    if (on && 'wakeLock' in navigator) { wakeLock = await navigator.wakeLock.request('screen'); }
    else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) { wakeLock = null; }
}

// ---------- Import ----------
function detectImport(data) {
  if (data && data.type === 'rezept' && data.recipe && typeof data.recipe === 'object') return { kind: 'recipe', recipe: normalize(data.recipe), linkedTitles: Array.isArray(data.linkedTitles) ? data.linkedTitles.map(String) : [] };
  if (Array.isArray(data)) return { kind: 'backup', recipes: data.map(normalize), plan: null, pantry: null, shop: null, at: null };
  if (data && Array.isArray(data.recipes)) return { kind: 'backup', recipes: data.recipes.filter(x => x && typeof x === 'object').map(normalize),
    plan: validPlan(data.plan), pantry: validPantry(data.pantry), shop: Array.isArray(data.shop) ? data.shop.filter(i => i && typeof i.name === 'string') : null, at: data.exportedAt || null };
  if (data && typeof data === 'object' && typeof data.title === 'string' && Array.isArray(data.ingredients)) return { kind: 'recipe', recipe: normalize(data), linkedTitles: [] };
  return null;
}
const validPlan = (p) => p && typeof p === 'object' && p.days && typeof p.days === 'object' ? { days: p.days } : null;
const validPantry = (p) => p && Array.isArray(p.cats) && Array.isArray(p.items) ? { cats: p.cats.filter(c => c && c.id), items: p.items.filter(i => i && typeof i.name === 'string') } : null;
async function snapshotForUndo() {
  await KV.set('undo', { at: Date.now(), recipes: JSON.parse(JSON.stringify(state.recipes)), plan: JSON.parse(JSON.stringify(state.plan)), pantry: JSON.parse(JSON.stringify(state.pantry)), shop: JSON.parse(JSON.stringify(state.shop)) });
}
async function replaceAllRecipes(list) {
  state.recipes = list;
  if (Store.mode === 'idb') { await Store._tx('readwrite', s => s.clear()); await Store.putMany(list); }
  else if (Store.mode === 'ls') Store._lsWrite();
  else { Store.mem.clear(); list.forEach(r => Store.mem.set(r.id, r)); }
}
async function applyBackup(imp, mode) {
  await snapshotForUndo();
  if (mode === 'replace') {
    await replaceAllRecipes(imp.recipes);
    if (imp.plan) state.plan = imp.plan;
    if (imp.pantry) state.pantry = imp.pantry;
    if (imp.shop) state.shop = imp.shop;
  } else {
    const changed = [];
    for (const r of imp.recipes) {
      const i = state.recipes.findIndex(x => x.id === r.id);
      if (i < 0) { state.recipes.push(r); changed.push(r); }
      else if ((r.updatedAt || 0) >= (state.recipes[i].updatedAt || 0)) { state.recipes[i] = r; changed.push(r); }
    }
    if (Store.mode === 'ls') Store._lsWrite(); else await Store.putMany(changed);
    if (imp.plan) Object.assign(state.plan.days, imp.plan.days);
    if (imp.pantry) {
      const catMap = {};
      for (const c of imp.pantry.cats) {
        let own = state.pantry.cats.find(x => x.name === c.name);
        if (!own) { own = { id: uid(), name: c.name, emoji: c.emoji || '📦' }; state.pantry.cats.push(own); }
        catMap[c.id] = own.id;
      }
      for (const it of imp.pantry.items) {
        if (state.pantry.items.some(x => shopNorm(x.name) === shopNorm(it.name))) continue;
        state.pantry.items.push(Object.assign({}, it, { id: uid(), catId: catMap[it.catId] || (state.pantry.cats[0] && state.pantry.cats[0].id) }));
      }
    }
    if (imp.shop) for (const it of imp.shop) if (!state.shop.some(x => !x.done && shopNorm(x.name) === shopNorm(it.name))) state.shop.push(Object.assign({}, it, { id: uid() }));
  }
  for (const k of ['plan', 'pantry', 'shop']) await KV.set(k, state[k]);
  state.cook = {};
}
async function undoImport() {
  const u = await KV.get('undo', null); if (!u) return;
  await replaceAllRecipes(u.recipes.map(normalize));
  state.plan = u.plan; state.pantry = u.pantry; state.shop = u.shop;
  for (const k of ['plan', 'pantry', 'shop']) await KV.set(k, state[k]);
  await KV.set('undo', null);
  $('#dlg').open && $('#dlg').close();
  toast('Import rückgängig gemacht'); render();
}

function editor(d, isNew) {

      delete clean._saved;
      clean.ingredients = clean.ingredients.filter(i => i.name.trim() || parseNum(i.kcal));
      clean.steps = clean.steps.filter(s => s.trim());
      clean.spiceGroups = clean.spiceGroups.map(g => ({ ...g, spices: g.spices.filter(s => s.name.trim()) })).filter(g => g.name.trim() || g.spices.length);
      try { await saveRecipe(clean); } catch (e) { return; }

  };

  // Handy: immer nur ein Tag. Gewechselt wird per Leiste oder deutlichem Wischen (vertikales Scrollen bleibt ungestört)
  let cur = idx;
  const show = (i, dir) => {
    if (i === cur && !dir) return;
    cur = i; state.dayKey = dkey(days[i]);
    [...daysEl.children].forEach((c, j) => { c.classList.toggle('active', j === i); c.classList.remove('slide-next', 'slide-prev'); });
    strip.querySelectorAll('.ds').forEach((b, j) => b.classList.toggle('on', j === i));
    if (dir) { const c = daysEl.children[i]; void c.offsetWidth; c.classList.add('slide-' + dir); }
  };
  [...daysEl.children].forEach((c, j) => c.classList.toggle('active', j === idx));
  const stepDay = (step) => {
    const n = cur + step;
    if (n >= 0 && n <= 6) return show(n, step > 0 ? 'next' : 'prev');
    state.weekOffset += step; state.dayKey = dkey(addDays(start, step > 0 ? 7 : -1)); state.slideIn = step > 0 ? 'next' : 'prev'; rerenderTab();
  };
  let t0 = null;
  daysEl.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1 || e.target.closest('input, select, textarea')) { t0 = null; return; }
    t0 = { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now(), lock: null };
  }, { passive: true });
  daysEl.addEventListener('touchmove', (e) => {
    if (!t0) return;
    const dx = e.touches[0].clientX - t0.x, dy = e.touches[0].clientY - t0.y;
    if (!t0.lock && (Math.abs(dx) > 14 || Math.abs(dy) > 10)) t0.lock = Math.abs(dx) > Math.abs(dy) * 2 ? 'x' : 'y';
    if (t0.lock === 'x') { const c = daysEl.children[cur]; c.style.transition = 'none'; c.style.transform = `translateX(${dx * 0.35}px)`; }
  }, { passive: true });
  const endSwipe = (e) => {
    if (!t0) return;
    const c = daysEl.children[cur]; const dx = (e.changedTouches[0] || {}).clientX - t0.x; const lock = t0.lock; t0 = null;
    c.style.transition = ''; c.style.transform = '';
    if (lock === "x" && Math.abs(dx) > 80) stepDay(dx < 0 ? 1 : -1);
  };
  daysEl.addEventListener('touchend', endSwipe, { passive: true });
  daysEl.addEventListener('touchcancel', () => { if (t0) { const c = daysEl.children[cur]; c.style.transform = ''; t0 = null; } }, { passive: true });
  wrap.append(strip, daysEl);
  if (state.slideIn) { daysEl.children[idx].classList.add('slide-' + state.slideIn); state.slideIn = null; }

  wrap.append(h('button', { class: 'btn primary wk-shop', id: 'wk-shop', onclick: () => shopWeek(datas) }, icon('cart'), 'Für die Woche einkaufen'));
  wrap.append(h('div', { class: 'summary' },
    tile(withRec.length ? fmt(avg('kcal')) + ' kcal' : '–', 'Ø pro Tag (Tage mit Rezepten)'),
    tile(withRec.length ? fmt(avg('protein')) + ' g' : '–', 'Ø Protein pro Tag'),
    tile(String(sportDays), 'Tage mit Sport')));
  return wrap;
}

/* ---------- Updates ---------- */
async function checkForUpdate() {
  if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) { toast('Updates gibt es nur in der installierten App.'); return; }
  toast('Suche nach Updates …');
  try {
    const reg = await navigator.serviceWorker.getRegistration();
    if (reg) { await reg.update(); await new Promise(r => setTimeout(r, 1500)); }
    const w = reg && (reg.waiting || reg.installing);
    if (w) { w.postMessage('skip-waiting'); setTimeout(() => location.reload(), 1200); return; }
    // Sicherheitsnetz: Programmdateien neu laden (deine Daten bleiben erhalten)
    const keys = await caches.keys(); await Promise.all(keys.filter(k => k.startsWith('eriks-rezepte-')).map(k => caches.delete(k)));
    if (reg) await reg.unregister();
    location.reload();
  } catch (e) { location.reload(); }
}

function shopRow(it) {

  return h('div', { class: 'sitem' + (it.done ? ' done' : ''), 'data-item': it.name },
    h('input', { type: 'checkbox', class: 'check', checked: it.done, 'aria-label': it.name + ' abhaken', onchange: (e) => { it.done = e.target.checked; persist('shop'); rerenderTab(); } }),
    h('div', { style: { minWidth: '0' } }, h('div', { class: 'nm' }, it.name),
      (it.source || pm) ? h('div', { class: 'meta' }, it.source ? h('span', null, `für ${it.source}`) : null, pantryBadge(pm)) : null),
    h('span', { class: 'amt' }, fmtShopAmt(it)),
    h('button', { class: 'mini del', 'aria-label': it.name + ' entfernen', onclick: () => { state.shop = state.shop.filter(x => x !== it); persist('shop'); rerenderTab(); } }, icon('x')));
}
async function copyShop() {
  const text = state.shop.filter(i => !i.done).map(i => `• ${fmtShopAmt(i) ? fmtShopAmt(i) + ' ' : ''}${i.name}`).join('\n');
  try { await navigator.clipboard.writeText(text); toast('📋 Liste kopiert'); }
  catch (e) {
    const ta = h('textarea', { style: { position: 'fixed', opacity: '0' } }); ta.value = text; document.body.append(ta); ta.select();
    try { document.execCommand('copy'); toast('📋 Liste kopiert'); } catch (e2) { toast('Kopieren nicht möglich.'); }
    ta.remove();
  }
}
function doneToPantry() {
  const done = state.shop.filter(i => i.done); let upd = 0, neu = 0;
  for (const it of done) {
    const m = matchPantry(it.name);
    const count = ['x', 'Stück', 'Dose', 'Packung', 'Glas', 'Becher'].includes(it.unit) && parseNum(it.amount) ? parseNum(it.amount) : 1;
    if (m) { m.qty = (m.qty == null ? 1 : m.qty) + count; upd++; }
    else {
      let cat = state.pantry.cats.find(c => c.name === 'Neu eingekauft');
      if (!cat) { cat = { id: uid(), name: 'Neu eingekauft', emoji: '🆕' }; state.pantry.cats.push(cat); }
      state.pantry.items.push({ id: uid(), catId: cat.id, name: it.name, emoji: guessEmoji(it.name), qty: count, note: '' }); neu++;
    }
  }
  state.shop = state.shop.filter(i => !i.done);
  persist('shop'); persist('pantry');
  toast(`🫙 ${upd} im Vorrat aufgefüllt, ${neu} neu angelegt`);
  rerenderTab();
}

function seedPantry() {
  const data = [
    ['Kochen', '🍳', [['Passierte Tomaten', '🍅', 2], ['Kidneybohnen', '🫘', 2], ['Kokosmilch light', '🥥', 1]]],
    ['Carbquellen', '🍝', [['Basmati-Reis', '🍚', 1], ['Vollkornnudeln', '🍝', 1]]],
    ['Frühstück', '🥣', [['Haferflocken', '🌾', 1]]],
    ['Beiwerk', '🥜', [['Walnüsse', '🥜', 1]]],
    ['Flüssiges', '🫗', [['Olivenöl', '🫒', 1]]],
    ['Süßzeug', '🍫', [['Zartbitter-Schokolade', '🍫', 0]]],
  ];
  const P = { cats: [], items: [] };
  for (const [name, emoji, items] of data) {
    const c = { id: uid(), name, emoji }; P.cats.push(c);
    for (const [n, e, q, note] of items) P.items.push({ id: uid(), catId: c.id, name: n, emoji: e, qty: q === undefined ? 1 : q, note: note || '' });
  }
  return P;
}
function seedPlan() { return { days: {} }; }

/* ---------- Start ---------- */
(async function init() {
  await Store.init();
  state.recipes = (await Store.all()).map(r => Object.assign(normalize(r), { example: !!r.example }));
  if (!state.recipes.length && !Settings.get('seeded', false)) {
    state.recipes = seedRecipes();
    try { if (Store.mode === 'ls') Store._lsWrite(); else await Store.putMany(state.recipes); } catch (e) {}
    Settings.set('seeded', true);
  }
  if (!Settings.get('demo5', false)) {
    const add = demoRecipes().filter(r => !byId(r.id));
    state.recipes.push(...add);
    try { if (Store.mode === 'ls') Store._lsWrite(); else await Store.putMany(add); } catch (e) {}
    Settings.set('demo5', true);
  }
  state.plan = await KV.get('plan', null);
  if (!state.plan) { state.plan = Settings.get('planSeeded', false) ? { days: {} } : seedPlan(); Settings.set('planSeeded', true); KV.set('plan', state.plan); }
  state.plan.days = state.plan.days || {};
  state.pantry = await KV.get('pantry', null);
  if (!state.pantry) { state.pantry = seedPantry(); KV.set('pantry', state.pantry); }
  if (state.pantry.items.some(i => i.qty == null)) { state.pantry.items.forEach(i => { if (i.qty == null) i.qty = 1; }); KV.set('pantry', state.pantry); }
  state.shop = await KV.get('shop', []);
  if (Store.mode === 'memory') toast('Dieser Browser speichert die Datei nicht dauerhaft. Backup nutzen!');
  // iOS gewährt das vor allem Apps auf dem Home-Bildschirm. Schützt vor Löschung bei Speicherknappheit.
  try { if (navigator.storage && navigator.storage.persist && !(await navigator.storage.persisted())) navigator.storage.persist(); } catch (e) {}
  const isWide = matchMedia('(min-width: 821px)').matches;
  if (!location.href.includes('#')) history.replaceState(null, '', '#woche');
  onRoute();
  window.__app = { state, Store, KV, Settings, parseMFP, totals, matchPantry, parseShopText, deleteRecipe, buildBackup, detectImport, safeImage };
})();
